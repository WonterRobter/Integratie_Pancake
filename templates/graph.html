<!doctype html>
<html>

<head>
    <title>Temperatuurgrafiek - PancakeScience</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1>PancakeScience</h1>
        <div class="user-info">
            Ingelogd als: <strong>{{ role if role else '' }}</strong>
            <a class="logout-link" href="{{ url_for('logout') }}">Uitloggen</a>
        </div>
    </header>

    <main>
        <h2>Temperatuurgrafiek</h2>
        <p><a href="{{ url_for('index') }}">← Terug naar dashboard</a></p>

        <canvas id="tempChart"></canvas>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            const labels = {{ labels| tojson }};
            const temps = {{ temps| tojson }};

            const ctx = document.getElementById('tempChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperatuur (°C)',
                        data: temps,
                        borderColor: '#ff8800',
                        tension: 0.2
                    }]
                },
                options: {
                    animation: false,
                    scales: {
                        y: { beginAtZero: false,
                            ticks: {
                                color: 'red'      // kleur cijfers langs y-as
                            }
                        },                      
                        x: {
                            beginAtZero: false,
                            ticks: {
                                color: 'red'      // kleur cijfers langs y-as
                            }
                        }
                    }
                }
            });
        </script>
    </main>

    <footer>
        PancakeScience – Grafiek
    </footer>
    <script>
        // Herlaad de pagina elke 5 seconden
        setInterval(function () {
            window.location.reload();
        }, 3000);
    </script>
</body>

</html>

<!doctype html>
<html>

<head>
    <title>Wachtwoord wijzigen - PancakeScience</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1>PancakeScience</h1>
        <div class="user-info">
            Ingelogd als: <strong>{{ role }}</strong>
            <a class="logout-link" href="{{ url_for('logout') }}">Uitloggen</a>
        </div>
    </header>

    <main style="max-width: 500px;">
        <div class="card">
            <h2>🔐 Welkom! Wijzig je wachtwoord</h2>
            <p>Je moet je wachtwoord wijzigen voordat je het dashboard kunt gebruiken.</p>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <div>
                    <input type="password" name="new_password" placeholder="Nieuw wachtwoord (min. 6 tekens)" required>
                </div>
                <div>
                    <input type="password" name="confirm_password" placeholder="Herhaal nieuw wachtwoord" required>
                </div>
                <button type="submit">Wachtwoord wijzigen</button>
            </form>

            <p style="text-align: center; margin-top: 2rem;">
                <a href="{{ url_for('logout') }}">← Opnieuw inloggen</a>
            </p>
        </div>
    </main>
</body>

</html>
